apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-v1
spec:
  replicas: 1   
  selector:
    matchLabels:
      app: node-app
      version: v1
  template:
    metadata:
      labels:
        app: node-app
        version: v1
    spec:
      containers:
      - name: node-app
        image: akshaykrishnaa/superman:v1
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-v1
spec:
  type: LoadBalancer
  selector:
    app: node-app
    version: v1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
